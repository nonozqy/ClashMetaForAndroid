name: Build APK

on:
  push:
    branches: [ build/apk ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout submodules
        run: git submodule update --init --recursive --force

      - name: Setup submodule branches
        run: |
          git submodule foreach '
            git fetch --depth=1 origin HEAD 2>/dev/null || true
            git branch -r 2>/dev/null | head -5 || true
          '

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Update CA
        run: |
          sudo apt-get update && sudo apt-get install -y ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew --no-daemon app:assembleAlphaRelease

      - name: Upload APK (universal)
        uses: actions/upload-artifact@v4
        with:
          name: cmfa-alpha-release-unsigned
          path: app/build/outputs/apk/alpha/release/*.apk
