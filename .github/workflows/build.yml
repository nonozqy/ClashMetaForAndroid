name: Build APK

on:
  push:
    branches: [ build/apk ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup submodule branches
        run: |
          git submodule foreach '
            git fetch --depth=1 origin HEAD 2>/dev/null || true
            git branch -r 2>/dev/null | head -5 || true
          '

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14206865" --sdk_root=$ANDROID_SDK_ROOT

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Download geo files
        run: ./gradlew downloadGeoFiles

      - name: Build meta release APK
        run: ./gradlew assembleMeta

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cmfa-meta-release
          path: app/build/outputs/apk/meta/release/*.apk
